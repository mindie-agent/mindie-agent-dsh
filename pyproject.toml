[project]
name = "mindie-agent-dsh-runtime"
version = "0.1.8"
description = "Pinned component runtime for the MindIE Agent DeepSeek Harness adapter"
requires-python = ">=3.11"
dependencies = [
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@5ae643e19223f2181ecdbaa3edaf464137c4805e",
  "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@9af5a82ad557e2120277693854a0571613c8a115",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@2a750ec8c74d7f053410d48dd820aeb542e7d3b1",
]

[dependency-groups]
component-contracts = [
  "mindie-profiler @ git+https://github.com/mindie-agent/profiler@25c789cd42389c893234c5db20eca67e63b8878a",
  "mindie-sim @ git+https://github.com/mindie-agent/sim@15f93f3f0247b2653d0e9441eae56959e4d16d4e",
  "mindie-coordinator @ git+https://github.com/mindie-agent/coordinator@e4a86c972a99c442c78ad7f7ba627af7da5ef7f2",
]

[tool.uv]
package = false
# The reviewed plugin selection also replaces older transitive component pins.
override-dependencies = [
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@5ae643e19223f2181ecdbaa3edaf464137c4805e",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@2a750ec8c74d7f053410d48dd820aeb542e7d3b1",
]
