[project]
name = "mindie-agent-dsh-runtime"
version = "0.1.4"
description = "Pinned component runtime for the MindIE Agent DeepSeek Harness adapter"
requires-python = ">=3.11"
dependencies = [
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@1c465a18e4db59a0889557971b59d6233d8ae726",
  "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@38a42f6f778cfa555d8918fdcacd12cee4a181f5",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@2bd3a9e7c89a49cb9d495405a87316f5ea3064ec",
]

[tool.uv]
package = false
# The reviewed plugin selection also replaces older transitive component pins.
override-dependencies = ["mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@1c465a18e4db59a0889557971b59d6233d8ae726"]
