name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@3bf7fa6efc111876cc31c602f11dcd0c029769d7
    with:
      benchmark-ref: 3bf7fa6efc111876cc31c602f11dcd0c029769d7
      version-files: |
        package.json
        pyproject.toml
      setup-command: |
        uv sync --locked && uv pip install -r requirements-dev.txt pytest
      test-command: |
        .venv/bin/python -m pytest -q -m "not live_npu"
        node --check paths.cjs
      node: true
      build-command: |
        npm pack --pack-destination "$RELEASE_ASSETS_DIR"
