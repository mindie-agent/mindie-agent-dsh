name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@484b80621aaf9293c559786d0ef2174c79a0dbb4
    with:
      benchmark-ref: 484b80621aaf9293c559786d0ef2174c79a0dbb4
      release-notes-path: docs/releases/mindie-agent-dsh-0.1.2.md
      version-files: |
        package.json
        pyproject.toml
      setup-command: |
        uv sync --locked && uv pip install -r requirements-dev.txt pytest
      test-command: |
        .venv/bin/python -m pytest -q -m "not live_npu"
        node --check paths.cjs
        node --test tests/test_manual_entry_host.mjs
        node --test tests/test_generation_launcher.mjs
      node: true
      build-command: |
        npm pack --pack-destination "$RELEASE_ASSETS_DIR"
