name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install uv
          uv sync --locked --no-editable --no-dev
          uv pip install -r requirements-dev.txt
      - name: Contract and protocol tests
        run: uv run --no-sync python -m pytest -q
      - name: JavaScript contracts
        run: |
          node --check paths.cjs
          node --check host.mjs
          node --check host3.mjs
          node tests/test_summary_endpoint.mjs
          node --test tests/test_manual_entry_host.mjs
          node --test tests/test_generation_launcher.mjs
