name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked runtime and test dependencies
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          python -m pip install uv
          uv sync --locked --no-editable --no-dev --group component-contracts
          uv pip install -r requirements-dev.txt
          uv pip install --no-deps "mindie-harness @ git+https://github.com/mindie-agent/harness.git@main"
          npm install --no-save --package-lock=false @deepseek-ai/dsh@0.2.0-rc.2
      - name: Enforce Unix LF Line Endings
        run: python .github/scripts/check_lf_eol.py
      - name: Contract and protocol tests
        run: uv run --no-sync python -m pytest -q -ra -m "not live_npu"
      - name: JavaScript contracts
        run: |
          node --check paths.cjs
          node --check host.mjs
          node --check host3.mjs
          node tests/test_summary_endpoint.mjs
          node --test tests/test_manual_entry_host.mjs
          node --test tests/test_update_host.mjs
          node --test tests/test_generation_launcher.mjs
          node --test tests/test_remote_isolation.mjs
          node --test tests/test_log_rotation.mjs
          node --test tests/test_summary_host.mjs
          node --test tests/test_win32_spawn_and_gating.mjs
      - name: Outside-checkout package smoke check
        shell: bash
        run: |
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          REPO_DIR="$PWD"
          cd "$SMOKE_DIR"
          MINDIE_DSH_DATA_HOME="$SMOKE_DIR/data" MINDIE_DSH_CONFIG_HOME="$SMOKE_DIR/config" node -e '
            const path = require("node:path");
            const mod = require(path.join(process.argv[1], "paths.cjs"));
            mod.paths();
            const seeds = mod.seedPaths();
            if (!seeds.seedArchive.endsWith("mindie-harness-seed.pyz")) process.exit(1);
            if (mod.backgroundSpawnOptions("win32").detached !== false) process.exit(1);
          ' "$REPO_DIR"
          uv run --directory "$REPO_DIR" --no-sync python -c "import importlib.util, pathlib, sys; p = pathlib.Path(sys.argv[1]) / 'scripts' / 'mindie_launch.py'; s = importlib.util.spec_from_file_location('ml', p); m = importlib.util.module_from_spec(s); s.loader.exec_module(m); m._verify_seed(p.parents[1]/'assets/mindie-harness-seed.pyz', p.parents[1]/'assets/seed-lock.json')" "$REPO_DIR"

  release-ready:
    name: release-ready
    needs: [contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), "required CI failed or was skipped"'
