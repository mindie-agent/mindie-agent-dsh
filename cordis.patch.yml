# MindIE Agent for DeepSeek Harness — host composition patch.
#
# This bundle adds three Host rows and overrides no shipped row and no shipped
# preset. The only DSH packages it uses are stable (non-experimental):
#
#   @deepseek-ai/dsh-skill-filesystem  (the provider the standard preset uses)
#   @deepseek-ai/dsh-mcp-client        (the shipped MCP stdio bridge)
#
# The knowledge tool surface is this package's own Host plugin; the published
# mindie-knowledge runtime still owns capture, redaction and indexing. The rows
# are Host rows, so the skill, native tools and remote-dev MCP are inherited by
# every agent preset, including the shipped `standard` preset. Nothing here
# shadows or rewrites the standard composition.
#
# `baseUrl` is the profile context base URL, so createRequire resolves this
# bundle from the profile's node_modules exactly as the shipped cordis preset
# resolves its own bundled skills.

- insert:
    # The `/mindie-agent` user entry. The skill has
    # `disable-model-invocation: true`, so it never enters the model catalog
    # and can only be injected by an explicit `/mindie-agent` user invocation.
    - id: mindie-agent-skill
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: mindie
        includeDefaultRoots: false
        watch: false
        customSkillDirs:
          - !!js process.getBuiltinModule('node:module').createRequire(baseUrl)('mindie-agent-dsh/paths.cjs').paths().skillsDir

    # Native Host tool surface and the Stop handoff. The knowledge bridge is
    # an ordinary Host plugin (this package's index.mjs); the published
    # mindie-knowledge runtime still owns capture, redaction and indexing.
    - id: mindie-agent-host
      name: ./host.mjs
      config:
        mcpPluginUrl: !!js process.getBuiltinModule('node:url').pathToFileURL(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-mcp-client')).href
      inject:
        - tools
        - agents
        - llm
