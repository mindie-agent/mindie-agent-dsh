# MindIE Agent for DeepSeek Harness — host composition patch.
#
# This bundle adds two Host rows and overrides no shipped row and no shipped
# preset. The only DSH packages it uses are stable (non-experimental):
#
#   @deepseek-ai/dsh-skill-filesystem  (the provider the standard preset uses)
#   @deepseek-ai/dsh-mcp-client        (the shipped MCP stdio bridge)
#
# The two per-session MCP surfaces (`remote-dev` and `mindie-tools`) are spawned by
# this package's `host.mjs` through `scripts/mindie_launch.py` and `mindie-harness`;
# the published mindie-knowledge runtime still owns capture, redaction and indexing.
# The rows are Host rows, so the skill, native tools and per-session MCP clients are
# inherited by every agent preset, including the shipped `standard` preset. Nothing
# here shadows or rewrites the standard composition.
#
# `baseUrl` is the profile context base URL, so createRequire resolves this
# bundle from the profile's node_modules exactly as the shipped cordis preset
# resolves its own bundled skills.

- insert:
    # Semantic Ascend AI Infra workflow skill exposed to every agent preset
    # alongside the default-enabled Host knowledge and MCP tool surfaces.
    - id: mindie-agent-skill
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: mindie
        includeDefaultRoots: false
        watch: false
        customSkillDirs:
          - !!js process.getBuiltinModule('node:module').createRequire(baseUrl)('mindie-agent-dsh/paths.cjs').paths().skillsDir

    # Thin Host launcher: mounts `host3.mjs` and the two per-session MCP clients.
    # The published mindie-knowledge runtime still owns capture and indexing.
    - id: mindie-agent-host
      name: ./host.mjs
      config:
        mcpPluginUrl: !!js process.getBuiltinModule('node:url').pathToFileURL(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-mcp-client')).href
      inject:
        - tools
        - agents
        - llm
